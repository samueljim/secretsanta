<!doctype html>
<html>

    <head>
        <script type="module" src="https://cdn.jsdelivr.net/npm/textfit-web-component@1.0/textfit.js"></script>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Secret Santa Generator</title>

        <script src="/vendors/Lodash-3.10.1.js"></script>
        <script src="/vendors/Cryptojs.aes-3.1.2.js"></script>

        <script src="/SecretSanta.js"></script>

        <style>

            * {
                box-sizing: border-box;
            }

            html, body, .main {
                margin: 0;

                width: 100%;
                height: 100%;

                padding: 0;
            }

            body {
                /* Use a semi-transparent white layer under the image to give a faded effect */
                background-image: linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5)), url(/assets/santa.png);
                background-position: bottom right, bottom right;
                background-repeat: no-repeat, no-repeat;
                background-color: #90f3a9;
                font-family: 'Comic Sans MS';
                background-size: auto, contain;
            }

            .main {
                display: grid;
                flex-direction: row;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr;
            }

            .part {
                display: flex;
                flex-direction: column;

                padding: 20px;

                flex: 1;
            }

            .instructions {
                margin: auto 10%;
            }

            .instructions a {
                text-decoration: none;

                color: #0CB50C;
            }

            .input {
                display: block;
                align-self: stretch;

                width: 100%;
                flex: auto;

                border: 10px solid #0CB50C;
                border-radius: 10px;

                padding: 15px;

                background-color: rgba(255, 255, 255, .7);
                outline: none;
            }

            .generate {
                display: block;

                margin-top: 20px;

                flex: none;
                height: 100px;

                border: 10px solid #0CB50C;
                border-radius: 10px;

                font-family: inherit;
                font-size: 40px;

                background-color: #EA1212;
                color: #FFFFFF;
            }

            .generate:focus {
                border-color: #E6E020;

                outline: none;
            }

            .result {
                margin-top: 20px;

                flex: none;

                border: 10px solid #E6E020;
                border-radius: 10px;

                padding: 15px;

                background: #FFFFFF;
            }

            

            .result-instruction {
                font-weight: 700;
                margin-bottom: 10px;
                color: #0b5d0b;
                background: rgba(14, 196, 14, 0.08);
                padding: 8px 12px;
                border-radius: 8px;
            }

            .result.none {
                display: none;
            }

            .result.error {
                border-color: #EA1212;

                color: #EA1212;
            }

            .result-table {
                table-layout: fixed;

                width: 100%;
            }

            /* Layout each result row as a grid so the participant name gets
               priority (can take the remaining space) and the copy button
               remains visible. The link will be hidden on narrow widths. */
            .result-row {
                display: grid;
                grid-template-columns: auto 1fr auto; /* copy | name | link */
                gap: 12px;
                align-items: center;
            }

            .result-copy {
                width: auto;
                text-align: center;
                vertical-align: middle;
            }
            .result-copy button.copy-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                background-color: #0CB50C;
                color: white;
                border: none;
                border-radius: 8px;
                padding: 8px;
                width: 56px;
                height: 40px;
                font-size: 1.1rem;
                cursor: pointer;
            }

            .result-copy button.copy-btn:hover {
                background-color: #09a10a;
                transform: translateY(-1px);
            }

            /* Make the participant name more prominent and allow wrapping */
            .result-name {
                padding: 5px 8px;
                font-weight: 700;
                font-size: 1.05rem;
                white-space: normal; /* allow wrapping so full name is visible */
                overflow: visible;
                min-width: 0; /* allow flexing in grid */
            }

            /* Ensure table cells vertically align */
            .result-table td {
                vertical-align: middle;
            }

            .result-copy button.copy-btn:focus {
                outline: 3px solid rgba(230,224,32,0.6);
            }

            .result-copy .coffee {
                font-size: 1.1rem;
            }

            

            .toast {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                padding: 10px;
                background-color: #333;
                color: #fff;
                font-size: 1.2rem;
                text-align: center;
            }

            /* Responsive: stack the two columns on small screens so
               the results/links appear above the input form */
            @media (max-width: 900px) {
                .main {
                    grid-template-columns: 1fr;
                    grid-template-rows: minmax(auto, 1fr) minmax(auto, 1fr)
                }

                .part {
                    padding: 12px;
                }

                .instructions {
                    margin: 10px 0;
                }

                .generate {
                    height: 80px;
                    font-size: 28px;
                }
            }

            /* Emphasize the "coffee" generate button */
            .generate .coffee {
                margin-right: 10px;
                font-size: 1.4em;
                vertical-align: middle;
            }

            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.04); }
                100% { transform: scale(1); }
            }
            /* On narrow screens hide the long link so the name gets full width */
            @media (max-width: 740px) {
                .result-row {
                    grid-template-columns: 56px 1fr; /* fixed copy button then name */
                }

                

                .result-copy {
                    width: 56px;
                }

                .result-copy button.copy-btn {
                    width: 44px;
                    height: 36px;
                    padding: 6px;
                    font-size: 1rem;
                }
            }
            
        </style>

    </head>

    <body>

        <div class="main">
            <div class="part" style="overflow-y: auto">
                <div id="result" class="result none"></div>
                <div class="instructions">
                    <h1><img src="/assets/mistletoe.png" style="vertical-align: middle" />Secret Samta Generator</h1>
                    <p>It's a pun</p>
                </div>

            </div>

            <form id="form" class="part">
                <textarea id="input" class="input" autofocus></textarea>
                <button type="submit" class="generate" title="Click here to brew the pairings">
                <text-fit max-lines="1" >
                    Generate your pairings
                </text-fit>
            </button>
            </form>
        </div>

        <script id="input-placeholder" type="text/placeholder">
            # You can add a user by adding a line
            Santa

            # You can add some details if you want to, using parentheses after the name
            Nicholas (the elf)

            # You can prevent someone from being paired with someone else
            Sam !Ben
            Ben !Sam

            # You can also exclude someone from being paired with multiple people
            # Careful: too many exclusion rules can make your secret santa less interesting!
            Rudolph !Santa !Nicholas (the elf)

            # You can also cheat a bit and force someone to be paired with another
            Nicholas (the saint) =Nicholas (the elf)

            ...
        </script>

    </body>

    <script>

      function isAmazonEnabled() {

          const checkBox = document.getElementById('amazon');

          return checkBox ? checkBox.checked : false;

      }

      function persist() {

          if ( ! window.localStorage )
              return ;

          var amazon = isAmazonEnabled();
          var content = document.getElementById( 'input' ).value;

          window.localStorage.setItem( 'amazon', amazon );
          window.localStorage.setItem( 'input', content );

      }

      function restore() {

          if ( ! window.localStorage )
              return ;

          var amazon = window.localStorage.getItem( 'amazon' );
          var content = window.localStorage.getItem( 'input' );

          if (typeof amazon === 'undefined')
              amazon = true;

          if (typeof content === 'undefined')
              content = '';

          if ( document.getElementById( 'amazon' ) )
              document.getElementById( 'amazon' ).checked = amazon;

          document.getElementById( 'input' ).value = content;

      }

      function reset() {

          var result = document.getElementById( 'result' );

          result.classList.add( 'none' );
          result.classList.remove( 'error' );

      }

      function error(text) {

          var result = document.getElementById( 'result' );

          result.classList.remove( 'none' );
          result.classList.add( 'error' );

          result.innerText = text;

      }

      function success( pairings ) {

          var result = document.getElementById( 'result' );

          result.classList.remove( 'none' );
          result.classList.remove( 'error' );

          result.innerHTML = '';

          // Instruction text at top of results
          var instruction = document.createElement('div');
          instruction.className = 'result-instruction';
          instruction.innerText = "Click copy and then send the link privately to each person";
          result.appendChild(instruction);

          var table = document.createElement( 'table' );
          table.className = 'result-table';
          result.appendChild( table );

          var names = Object.keys( pairings ).sort();

          for ( var t = 0, T = names.length; t < T; ++ t ) {

              var name = names[ t ];
              var prettyName = names[ t ].replace( /\([^)]+\)/g, ' ' ).replace( / +/g, ' ' ).trim();

              var tr = document.createElement( 'tr' );
              tr.className = 'result-row';
              table.appendChild( tr );

              var tdCopy = document.createElement( 'td' );
              tdCopy.className = 'result-copy';

              var copyBtn = document.createElement('button');
              copyBtn.className = 'copy-btn';
              copyBtn.setAttribute('type', 'button');
              copyBtn.setAttribute('aria-label', 'Copy pairing link for ' + name);
              copyBtn.setAttribute('title', 'Copy pairing link for ' + name);
              copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';

              // click handler reads the URL directly from the button's data-href
              copyBtn.addEventListener('click', function(e) {
                  e.preventDefault();
                  var name = e.currentTarget.getAttribute('data-name') || e.currentTarget.parentElement.parentElement.querySelector('.result-name').innerText;
                  var href = e.currentTarget.getAttribute('data-href') || '';
                  navigator.clipboard.writeText(href);

                  var toast = document.createElement('div');
                  toast.classList.add('toast');
                  toast.innerHTML = `Copied to clipboard ${name}'s link`;
                  document.body.appendChild(toast);
                  setTimeout(function() { toast.remove(); }, 2000);
              });

              // keyboard support: Enter/Space to copy
              copyBtn.addEventListener('keydown', function(e) {
                  if ( e.key === 'Enter' || e.key === ' ' ) {
                      e.preventDefault();
                      e.currentTarget.click();
                  }
              });

              tdCopy.appendChild(copyBtn);
              tr.appendChild( tdCopy );

              var tdName = document.createElement( 'td' );
              tdName.className = 'result-name';
              tr.appendChild( tdName );

              // No separate link cell anymore: URL stored on the copy button

              var key = String( _.random( 0x0000, 0xFFFF ) );
              var encryptedPairing = CryptoJS.AES.encrypt( pairings[ name ], key );

              var pairingPath = window.location.pathname.replace( /[^/]+$/, '' ).replace('/create', '');
              var pairingQueryString = '?name=' + encodeURIComponent( prettyName ) + '&key=' + encodeURIComponent( key ) + '&pairing=' + encodeURIComponent( encryptedPairing );

              if ( isAmazonEnabled() )
                  pairingQueryString += '&extra=1';

              tdName.innerText = name;

              var href = window.location.protocol + '//' + window.location.host + pairingPath + pairingQueryString;
              copyBtn.setAttribute('data-href', href);
              copyBtn.setAttribute('data-name', name);

              // briefly pulse the copy button to draw attention
              (function(btn){
                  if (!btn) return;
                  btn.classList.add('pulse');
                  setTimeout(function(){ btn.classList.remove('pulse'); }, 4500);
              })( copyBtn );

          }

      }

      function updateAmazon() {

          var result = document.getElementById( 'result' );
          var buttons = result.querySelectorAll( '.copy-btn' );

          for ( var t = 0; t < buttons.length; ++t ) {

              var btn = buttons[t];

              var href = btn.getAttribute('data-href') || '';

              if ( isAmazonEnabled() )
                  href += '&extra=1';
              else
                  href = href.replace( /&extra=[01]/, '' );

              btn.setAttribute('data-href', href);

          }

      }

      function generate( e ) {

          e.preventDefault();

          var content = document.getElementById( 'input' ).value;

          // Convert carriage returns into line feeds
          content = content.replace( /(\r\n|\r)/g, '\n' );

          // Merge adjacent blank characters into a single space
          content = content.replace( /[ \t]+/g, ' ' );

          // Trim lines
          content = content.replace( /^ | $/gm, '' );

          // Strip comments
          content = content.replace( /^#.*$/gm, '' );

          // Strip empty lines
          content = content.replace( /\n+/g, '\n' );

          // Remove leading/trailing newlines
          content = content.replace( /^\n|\n$/g, '' );

          var lines = content.split( /\n/g );

          if ( lines.length === 0 || lines.length === 1 && lines[ 0 ].length === 0 )
              return reset();

          var santa = new SecretSanta();

          for ( var t = 0, T = lines.length; t < T; ++ t ) {

              var match = lines[ t ].match( /^((?:(?![!=]).)+)((?: [!=](?:(?! [!=]).)+)*)$/ );

              if ( ! match )
                  return error( 'Syntax error: "' + lines[ t ] + '" isn\'t valid' );

              var name = match[ 1 ];
              // detect duplicate names (exact string match)
              if ( typeof seenNames === 'undefined' )
                  var seenNames = Object.create(null);

              if ( seenNames[ name ] ) {
                  return error('Duplicate name on line ' + (t+1) + ': "' + name + '" — please change this so each participant will be able to know which person they need to buy a gift for.');
              }
              seenNames[ name ] = true;
              var rules = match[ 2 ] ? match[ 2 ].match(/[!=][^!=]+/g) : null;

              var person = santa.add( name );

              if (rules) {

                  for ( var u = 0, U = rules.length; u < U; ++ u ) {

                      var fnName = {

                          '=': 'enforce',
                          '!': 'blacklist'

                      }[ rules[ u ].charAt( 0 ) ];

                      person[ fnName ]( rules[ u ].slice( 1 ).trim() );

                  }

              }

          }

          try {
              return success( santa.generate() );
          } catch ( err ) {
            console.error(err.stack)
              return error( err.message );
          }

      }

      

    </script>

    <script>

        document.getElementById( 'input' ).placeholder = document.getElementById( 'input-placeholder' ).innerHTML.trim().replace( /^[ \t]+/gm, '' );
        document.getElementById( 'input' ).addEventListener( 'change', persist );

        if ( document.getElementById( 'amazon' ) ) {
            document.getElementById( 'amazon' ).addEventListener( 'change', updateAmazon );
            document.getElementById( 'amazon' ).addEventListener( 'change', persist );
        }

        document.getElementById( 'form' ).addEventListener( 'submit', generate );

        restore();

        

    </script>

</html>
